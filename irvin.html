<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sistema</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: Consolas, monospace; }
  .con { position: absolute; width: 420px; height: 240px; background: #0c0c0c; border: 1px solid #444; box-shadow: 0 0 12px #000; color: #ccc; font-size: 12px; }
  .con .bar { background: #1b3f8f; color: #fff; padding: 3px 6px; font-family: Tahoma, sans-serif; font-size: 12px; }
  .con .txt { padding: 6px; white-space: pre; height: calc(100% - 22px); overflow: hidden; box-sizing: border-box; }
  .err { color: #f55; }
  .pop { position: absolute; width: 290px; background: #ece9d8; border: 2px solid #0054e3; border-radius: 6px 6px 0 0; font-family: Tahoma, sans-serif; font-size: 13px; box-shadow: 2px 2px 8px rgba(0,0,0,.5); }
  .pop .t { background: linear-gradient(#0a5fe0, #0047d1); color: #fff; font-weight: bold; padding: 4px 8px; }
  .pop .b { padding: 10px; color: #000; display: flex; gap: 10px; align-items: center; }
  .pop svg { width: 56px; height: 56px; flex-shrink: 0; }
  #wallpaper {
    position: fixed;
    inset: 0;
    background-image: url('windows_xp.jpg');
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
    display: none;
  }
  #big { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column;
         background: linear-gradient(#3a7bd5, #1d4fa0); color: #fff; font-family: "Trebuchet MS", Tahoma, sans-serif;
         font-weight: bold; font-size: min(9vw, 88px); text-align: center; text-shadow: 3px 3px 0 #0a2a6b; }
  #big small { font-size: 14px; margin-top: 20px; opacity: .7; font-weight: normal; }
</style>
</head>
<body>
<div id="wallpaper"></div>
<div id="big">Feliz cumpleaños Irvin<small>Pulsa F11</small></div>

<script>
  const W = innerWidth, H = innerHeight;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const wait = ms => new Promise(r => setTimeout(mascotasr, ms));

  // Personajes originales (no son Clippy ni Bonzi)
  const mascotas = {
    clippy: '<img src="clippy.gif" style="width: 100px; height: auto;" alt="clippy">',
    wizard: '<img src="wizard.gif" style="width: 100px; height: auto;" alt="wizard">',
    bonzi: '<img src="bonzi.webp" style="width: 100px; height: auto;" alt="bonzi">',
  };
  const frases = [
    "F U C K"
  ];

  const procs = [
    "System failure: Memory corruption detected at 0x000000FF. Immediate shutdown required.",
    "A fatal exception 0E has occurred at 0028:C0011E36. The current application will be terminated",
    "System override detected: Unauthorized core access in progress. 0x000ff20f",
    "System stop: 0x0000007B (INACCESSIBLE_BOOT_DEVICE)",
    "SSRF: System"
  ];

  const consoles = [];

  function addConsole() {
    const el = document.createElement('div');
    el.className = 'con';
    el.style.left = rnd(0, Math.max(0, W - 420)) + 'px';
    el.style.top = rnd(0, Math.max(0, H - 240)) + 'px';
    el.innerHTML = '<div class="bar">C:\\WINDOWS\\system32\\cmd.exe</div><div class="txt"></div>';
    document.body.appendChild(el);
    consoles.push(el.querySelector('.txt'));
  }

  function addPopup() {
    const claves = Object.keys(mascotas);
    const el = document.createElement('div');
    el.className = 'pop';
    el.style.left = rnd(0, Math.max(0, W - 290)) + 'px';
    el.style.top = rnd(0, Math.max(0, H - 160)) + 'px';
    el.innerHTML = '<div class="t">Asistente del sistema</div><div class="b"><div></div><span></span></div>';
    el.querySelector('.b > div').innerHTML = mascotas[claves[Math.random() * claves.length | 0]];
    el.querySelector('.b span').textContent = frases[Math.random() * frases.length | 0];
    document.body.appendChild(el);
  }

  function tick(lineFn) {
    consoles.forEach(t => {
      t.innerHTML += lineFn();
      if (t.innerHTML.length > 3000) t.innerHTML = t.innerHTML.slice(-2000);
      t.scrollTop = t.scrollHeight;
    });
  }

  function showWindows(){
    document.getElementById('wallpaper').style.display = 'block';
  }

  function end(){
    document.querySelectorAll('.con, .pop').forEach(e => e.remove());
    consoles.length = 0;
    document.getElementById('big').style.display = 'flex';
  }

  const acelerationIncremental = 1;
  const currentSpeedToAppear = 40
  let aceleration = 1;
  let currentSpeed = 0;

  const firstEventTime = 3000;
  const secondEventTime = firstEventTime + 2000;
  const thirdEventTime = secondEventTime + 10000;
  const fourthEventTime = thirdEventTime + 1000;
  const fifthEventTime = fourthEventTime + 6000;
  const start = Date.now();
  const loop = setInterval(() => {
    const t = Date.now() - start;

    if (t >= fifthEventTime){
      clearInterval(loop);
      end();
    } else if (t >= fourthEventTime) {
      tick(() => '<span class="err">fuck fuck fuck fuck fuck fuck fuck fuck fuck fuck fuck fuck fuck fuck</span>\n');
    } else if (t >= thirdEventTime) {
      addPopup();
      tick(() => '<span class="err">ERROR</span>\n');
    } else if (t >= secondEventTime){
      if (currentSpeed >= currentSpeedToAppear){    
        addConsole();
        tick(() => procs[Math.random() * procs.length | 0] + "... [OK]\n");
        aceleration += acelerationIncremental;
        currentSpeed = 0
      }
      currentSpeed += aceleration;
    } else if (t >= firstEventTime){
      showWindows();
    }
    
  }, 50);
</script>
</body>
</html>
